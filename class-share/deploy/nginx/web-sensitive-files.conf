# 숨김 파일과 저장소 메타데이터 차단
# Let's Encrypt 인증 경로는 허용합니다.
location ~ /\.(?!well-known(?:/|$)) {
    return 404;
}

# 웹으로 제공할 필요가 없는 내부 디렉터리
location ^~ /sql/ {
    return 404;
}

location ^~ /tmp/ {
    return 404;
}

# 현재 사용하지 않는 레거시 SaaS 생성 진입점
location = /saasinit.php {
    return 404;
}

# 사용하지 않는 SAE 호환 코드
location ^~ /sae/ {
    return 404;
}

# 일회성·CLI 전용 관리자 도구
location = /admin/update_pw.php {
    return 404;
}

location = /admin/migrate_problem_templates.php {
    return 404;
}

# 내부 PHP 라이브러리는 직접 실행하지 않습니다.
# include의 JS·CSS·폰트 파일은 계속 공개됩니다.
location ~* ^/(?:include|class-share/include|class-share/admin/include)/.*\.php$ {
    return 404;
}

# 명령행 관리자 도구는 웹으로 실행하지 않습니다.
location ^~ /class-share/admin/cli/ {
    return 404;
}

# 업로드 디렉터리에서는 실행 코드와 능동 콘텐츠를 제공하지 않습니다.
location ~* ^/upload/.*\.(?:php|php3|php4|php5|phtml|phar|html?|xhtml|svg|xml|js|mjs|swf)(?:/|$) {
    return 404;
}

# 설정·백업·로그·문서 원본 차단
location ~* \.(?:sql|bak|old|orig|save|log|conf|ini|md|swp)$ {
    return 404;
}

# 편집기 임시 백업 파일 차단
location ~ ~$ {
    return 404;
}
