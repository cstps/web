# 저장소에 보관된 배포 문서는 웹으로 공개하지 않습니다.
location = /class-share/DEPLOYMENT.md {
    return 404;
}

location = /class-share/deploy {
    return 404;
}

location ^~ /class-share/deploy/ {
    return 404;
}

# 학교 행사 공개 주소
# /class-share/{학교}
location ~ ^/class-share/(?<class_share_school>(?!(?:admin|assets|include)(?:/|$))[a-z0-9]+(?:-[a-z0-9]+)*)/?$ {
    rewrite ^ /class-share/index.php?school=$class_share_school last;
}

# /class-share/{학교}/{행사}
location ~ ^/class-share/(?<class_share_school>(?!(?:admin|assets|include)(?:/|$))[a-z0-9]+(?:-[a-z0-9]+)*)/(?<class_share_event>[a-z0-9]+(?:-[a-z0-9]+)*)/?$ {
    rewrite ^ /class-share/index.php?school=$class_share_school&event=$class_share_event last;
}
